<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111827">
  <title>Sikeres ajánlatkérés | Czinke-Balogh Fuvarozás</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .success-page{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(circle at 80% 15%,rgba(245,158,11,.25),transparent 28%),linear-gradient(135deg,#111827,#1f2937 58%,#172033)}
    .success-card{width:min(700px,100%);background:#fff;border-radius:30px;padding:44px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.28)}
    .success-icon{width:94px;height:94px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#15803d;font-size:3rem;font-weight:900}
    .success-card h1{font-size:clamp(2rem,6vw,3.7rem);margin-bottom:16px}
    .success-card p{font-size:1.08rem;max-width:540px;margin:0 auto 16px}
    .success-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    .button.secondary{background:#fff;border:1px solid #d1d5db;box-shadow:none}
    @media(max-width:620px){.success-card{padding:30px 22px}.success-actions{flex-direction:column}}
  </style>
</head>
<body>
  <main class="success-page">
    <section class="success-card">
      <div class="success-icon">✓</div>
      <span class="tag">Sikeres elküldés</span>
      <h1>Köszönjük a megkeresését!</h1>
      <p>Ajánlatkérése sikeresen megérkezett hozzánk.</p>
      <p><strong>Hamarosan felvesszük Önnel a kapcsolatot</strong> a megadott telefonszámon vagy e-mail-címen.</p>
      <div class="success-actions">
        <a class="button" href="index.html">Vissza a főoldalra</a>
        <a class="button secondary" href="tel:+36501267124">Hívás: +36 50 126 7124</a>
      </div>
    </section>
  </main>
</body>
</html>
